# .github/workflows/ci.yml
#
# PURPOSE: Runs automated tests on every push and pull request to main.
# If any test fails, the pipeline fails — protecting the main branch
# from broken code being merged or deployed.
#
# Two jobs run in parallel:
# - backend: runs pytest tests against a real PostgreSQL database
# - frontend: runs Vitest component tests

name: Nestio CI
# Trigger on every push and pull request to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    # Spin up a PostgreSQL service container for the tests
    # This is a real PostgreSQL instance — same as production
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nestio_test_db
          POSTGRES_USER: nestio_user
          POSTGRES_PASSWORD: nestio_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python 3.13
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Cache pip dependencies — speeds up subsequent runs
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install backend dependencies
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run pytest — using the CI test database
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://nestio_user:nestio_password@localhost:5432/nestio_test_db
          TEST_DATABASE_URL: postgresql://nestio_user:nestio_password@localhost:5432/nestio_test_db
        run: |
          python -m pytest tests/ -v
