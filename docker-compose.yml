# docker-compose.yml
#
# PURPOSE: Orchestrates all three Nestio services in one command.
# "docker compose up --build" starts PostgreSQL, FastAPI, and React together.
#
# Service communication:
# - backend connects to db via "db:5432" (not localhost)
# - frontend connects to backend via "backend:8000" (not localhost)
# - Docker Compose creates an internal network automatically

version: "3.8"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nestio_db
    environment:
      POSTGRES_DB: nestio_db
      POSTGRES_USER: nestio_user
      POSTGRES_PASSWORD: nestio_password
    ports:
      - "5433:5432" # Map to 5433 on host to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data between container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestio_user -d nestio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nestio_backend
    environment:
      DATABASE_URL: postgresql://nestio_user:nestio_password@db:5432/nestio_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # Wait for PostgreSQL to be ready before starting
    volumes:
      - ./backend:/app # Mount source code for hot reload in development

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPTILER_API_KEY: jX2ycIJwZPzqSJSKkJQH
    container_name: nestio_frontend
    ports:
      - "5173:80" # Map Nginx port 80 to 5173 to match our dev URL
    depends_on:
      - backend

# Named volume — persists PostgreSQL data between docker compose down/up cycles
volumes:
  postgres_data:
