# frontend/nginx.conf
#
# PURPOSE: Nginx configuration for serving the React SPA.
# The key directive is "try_files $uri /index.html" — this ensures that
# refreshing any URL (e.g. /properties/1) serves index.html instead of 404.
# React Router then handles the routing client-side.


server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    types {
        application/javascript mjs js;
        text/css css;
    }

    default_type application/octet-stream;

    # Static assets — must come before the catch-all location
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Catch-all — serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}