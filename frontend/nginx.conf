# frontend/nginx.conf
#
# PURPOSE: Nginx configuration for serving the React SPA.
# The key directive is "try_files $uri /index.html" — this ensures that
# refreshing any URL (e.g. /properties/1) serves index.html instead of 404.
# React Router then handles the routing client-side.


server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|mjs)$ {
        add_header Content-Type application/javascript;
    }

    location ~* \.css$ {
        add_header Content-Type text/css;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}