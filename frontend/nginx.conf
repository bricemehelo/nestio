# frontend/nginx.conf
#
# PURPOSE: Nginx configuration for serving the React SPA.
# The key directive is "try_files $uri /index.html" — this ensures that
# refreshing any URL (e.g. /properties/1) serves index.html instead of 404.
# React Router then handles the routing client-side.


server {
    listen 80;
    server_name localhost;
    root /usr/share/ngix/html;

    location / {
        # Try the requested file first, fall back to index.html
        # This is required for React Router to work correctly
        try_files $uri $uri/ /index.html;

    }

    # Cache static assets aggressively they have content hashes in filenames
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public , immutable";
    }

}